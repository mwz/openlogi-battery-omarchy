name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed git jq quickshell

      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Check out current Omarchy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: quattro
          path: omarchy

      - name: Run checks
        env:
          OMARCHY_PATH: ${{ github.workspace }}/omarchy
        working-directory: plugin
        run: ./tests/run
